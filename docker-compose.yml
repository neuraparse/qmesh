  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Optional local LLM for the AI copilot (off by default).
  # Uncomment + `docker compose --profile ai up -d` to enable.
  # ollama:
