services:
  # qmesh service-mode: REST/gRPC API + small ledger UI.
  # Phase 0: scaffold only — service container builds qmesh and runs the CLI.
  qmesh:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: qmesh
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./ledger:/app/ledger
      - qmesh_keys:/root/.qmesh
    environment:
      QMESH_LEDGER_DIR: /app/ledger
      QMESH_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8788/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Postgres + Redis are reserved for Phase 6 (audit-grade ledger + queues).
  # Today the FastAPI service writes manifests to ./ledger as plain JSON;
  # uncomment these blocks once qmesh.service starts persisting to them.
  # postgres:
